services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:8099"
    volumes:
      - ./backend/.env:/app/backend/.env:ro
      - app-data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-data:
